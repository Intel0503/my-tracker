<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page fit the phone screen instead of showing a zoomed-out desktop page -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <meta name="description" content="Offline personal task and goal tracker">
  <title>My Tracker</title>
  <!-- The manifest + service worker are what make this installable and offline -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 id="view-title">Today</h1>
      <p id="today-label" class="muted"></p>
    </div>
  </header>

  <!-- Every screen (Tasks, Goals, Stats, More) is drawn inside here by app.js -->
  <main id="view" aria-live="polite"></main>

  <!-- Floating "+" button for adding a task or goal -->
  <button id="fab" class="fab" aria-label="Add">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Bottom navigation -->
  <nav class="bottomnav" aria-label="Main">
    <button data-view="tasks" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
      <span>Today</span>
    </button>
    <button data-view="goals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>
      <span>Goals</span>
    </button>
    <button data-view="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Stats</span>
    </button>
    <button data-view="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
      <span>More</span>
    </button>
  </nav>

  <!-- Pop-up panel used for add/edit forms and goal details -->
  <dialog id="sheet" class="sheet"><div id="sheet-body"></div></dialog>

  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
